<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NILESH KAPRI | Portfolio</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#333333",
              "background-light": "#F5F5F5",
              "background-dark": "#121212",
              "error": "#FF0000",
              "success": "#00CC00"
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderWidth: {
              '4': '4px',
            },
            borderRadius: {
              "DEFAULT": "0px",
              "lg": "0px",
              "xl": "0px",
              "full": "9999px"
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
              'fade-in': 'fadeIn 0.8s ease-out forwards',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              }
            }
          },
        },
      }
    </script>
    <style type="text/tailwindcss">
      @layer utilities {
        html {
          scroll-behavior: smooth;
        }
        .brutalist-shadow {
          box-shadow: 6px 6px 0px 0px #000000;
          transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .brutalist-shadow-charcoal {
          box-shadow: 6px 6px 0px 0px #333333;
        }
        .brutalist-shadow:hover {
          transform: translate(-2px, -2px);
          box-shadow: 8px 8px 0px 0px #000000;
        }
        .brutalist-shadow:active {
          transform: translate(2px, 2px);
          box-shadow: 3px 3px 0px 0px #000000;
        }
        .brutalist-input {
          transition: all 0.2s ease;
        }
        .brutalist-input:focus {
          outline: none;
          border-color: #333333;
          background-color: #ffffff;
          box-shadow: 4px 4px 0px 0px #333333;
        }
        .brutalist-input.error {
          border-color: #FF0000;
          color: #FF0000;
        }
        .brutalist-input.error::placeholder {
          color: #ffb3b3;
        }
        .brutalist-input.error:focus {
          box-shadow: 4px 4px 0px 0px #FF0000;
        }
        .grid-bg {
          background-size: 40px 40px;
          background-image: radial-gradient(circle, #333333 1px, transparent 1px);
        }
        .reveal-hidden {
          opacity: 0;
          transform: translateY(20px);
          transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal-visible {
          opacity: 1;
          transform: translateY(0);
        }
        .stagger-1 { transition-delay: 100ms; }
        .stagger-2 { transition-delay: 200ms; }
        .stagger-3 { transition-delay: 300ms; }
        .stagger-4 { transition-delay: 400ms; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-background-light font-display text-black selection:bg-primary selection:text-white">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
